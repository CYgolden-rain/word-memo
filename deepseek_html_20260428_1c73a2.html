<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 中考词汇1600 · 多维记忆强化版</title>
    <style>
        :root {
            --bg: #f7f9fc;
            --card-bg: #ffffff;
            --primary: #4361ee;
            --primary-light: #eef0ff;
            --primary-dark: #3a56d4;
            --accent: #f72585;
            --accent-light: #fff0f6;
            --success: #06d6a0;
            --success-light: #e6faf3;
            --warning: #ffd166;
            --warning-light: #fffae6;
            --danger: #ef476f;
            --danger-light: #fff0f3;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05),0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 4px 16px rgba(0,0,0,0.06),0 2px 6px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.1),0 4px 12px rgba(0,0,0,0.06);
            --radius: 20px;
            --radius-sm: 14px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); min-height:100vh;
            display:flex; justify-content:center; align-items:flex-start; padding:12px;
            -webkit-tap-highlight-color:transparent; user-select:none;
        }
        .app-container { width:100%; max-width:520px; position:relative; z-index:1; display:flex; flex-direction:column; gap:14px; }
        .header { text-align:center; padding:6px 0; }
        .header .logo { display:inline-flex; align-items:center; gap:8px; font-size:1.7rem; font-weight:800; color:var(--primary-dark); }
        .header .logo .icon { width:44px; height:44px; background:linear-gradient(135deg, #4361ee, #7209b7); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:#fff; }
        .subtitle { font-size:0.85rem; color:var(--text-secondary); margin-top:4px; }
        .goal-banner { background:var(--card-bg); border-radius:var(--radius-sm); padding:14px 18px; display:flex; align-items:center; gap:16px; box-shadow:var(--shadow-sm); flex-wrap:wrap; }
        .goal-streak { display:flex; align-items:center; gap:6px; background:#fff3cd; border-radius:24px; padding:6px 14px; font-weight:700; color:#b76e00; font-size:0.85rem; }
        .goal-info { flex:1; min-width:120px; }
        .goal-info .goal-title { font-weight:700; font-size:0.9rem; }
        .goal-info .goal-detail { font-size:0.75rem; color:var(--text-secondary); }
        .goal-progress { width:100%; height:6px; background:#e2e8f0; border-radius:10px; margin-top:6px; overflow:hidden; }
        .goal-progress-fill { height:100%; border-radius:10px; background:linear-gradient(90deg, #4361ee, #7209b7); transition:width 0.5s ease; }
        .stats-strip { display:flex; gap:8px; flex-wrap:wrap; }
        .stat-chip { flex:1; min-width:60px; background:var(--card-bg); border-radius:var(--radius-sm); padding:12px 8px; text-align:center; box-shadow:var(--shadow-sm); }
        .stat-chip .stat-value { font-size:1.4rem; font-weight:700; color:var(--primary-dark); }
        .stat-chip .stat-label { font-size:0.7rem; color:var(--text-secondary); }
        .tab-nav { display:flex; background:var(--card-bg); border-radius:36px; padding:4px; box-shadow:var(--shadow-sm); gap:2px; }
        .tab-btn { flex:1; padding:10px 4px; border:none; background:transparent; border-radius:32px; cursor:pointer; font-size:0.85rem; font-weight:600; color:var(--text-secondary); transition:var(--transition); }
        .tab-btn.active { background:var(--primary); color:#fff; }
        .panel { display:none; flex-direction:column; gap:14px; animation:fadeSlideIn 0.25s ease; }
        .panel.active { display:flex; }
        @keyframes fadeSlideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .card-container { perspective:1000px; width:100%; min-height:340px; cursor:pointer; }
        .card-inner { position:relative; width:100%; min-height:340px; transition:transform 0.4s; transform-style:preserve-3d; }
        .card-inner.flipped { transform:rotateY(180deg); }
        .card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:var(--shadow-lg); background:var(--card-bg); min-height:340px; overflow-y:auto; }
        .card-front { z-index:2; border:2px solid var(--border); background: #fdfdfe; }
        .card-back { transform:rotateY(180deg); border:2px solid var(--accent); background: #fff9fb; }
        .card-word { font-size:2.2rem; font-weight:700; color:var(--text); line-height:1.3; }
        .card-phonetic { font-size:1rem; color:var(--text-secondary); margin-top:6px; font-style:italic; }
        .card-pos-tag { display:inline-block; background:var(--primary-light); color:var(--primary-dark); padding:4px 14px; border-radius:20px; font-size:0.85rem; font-weight:600; margin-top:8px; }
        .card-meaning { font-size:2rem; font-weight:700; color:#9b2c5c; margin:10px 0; }
        .card-relations { font-size:0.85rem; color:var(--text-secondary); width:100%; margin-top:8px; }
        .rel-section { margin-top:8px; text-align:left; }
        .rel-title { font-weight:700; color:var(--primary-dark); margin-bottom:3px; display:flex; align-items:center; gap:4px; }
        .rel-item { display:inline-block; padding:2px 8px; margin:2px 4px 2px 0; border-radius:12px; font-size:0.8rem; font-weight:500; }
        .rel-item.syn { background:#eef0ff; color:#3a56d4; }
        .rel-item.ant { background:#fff0f6; color:#b3005c; }
        .rel-item.fam { background:#e6faf3; color:#0d7c5c; }
        .card-tap-hint { margin-top:12px; font-size:0.7rem; color:var(--text-light); }
        .card-pronounce-btn { margin-top:8px; width:42px; height:42px; border-radius:50%; border:2px solid var(--border); background:#fff; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; color:var(--primary); }
        .btn { padding:12px 20px; border-radius:24px; border:none; cursor:pointer; font-weight:600; font-size:0.9rem; transition:var(--transition); }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-accent { background:var(--accent); color:#fff; }
        .btn-outline { background:#fff; border:2px solid var(--border); }
        .btn-sm { padding:8px 14px; font-size:0.8rem; border-radius:20px; }
        .btn-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
        .self-rate-group { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
        .self-rate-btn { padding:10px 16px; border-radius:24px; border:2px solid var(--border); cursor:pointer; font-weight:600; font-size:0.85rem; background:#fff; }
        .self-rate-btn.known { border-color:var(--success); color:var(--success); background:var(--success-light); }
        .self-rate-btn.unknown { border-color:var(--danger); color:#c00030; background:var(--danger-light); }
        .upload-zone { border:2px dashed #cbd5e0; border-radius:var(--radius-sm); padding:20px; text-align:center; cursor:pointer; }
        .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-120px); background:#1e293b; color:#fff; padding:12px 24px; border-radius:30px; font-weight:600; z-index:1000; transition:0.35s; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.success { background:#06d6a0; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header"><div class="logo"><span class="icon">🚀</span> 词汇冲刺</div><div class="subtitle">⏳ 30天 · 1600词 · 超强关联记忆</div></div>
    <div class="goal-banner">
        <div class="goal-streak">🔥 连续 <span id="streakDays">0</span> 天</div>
        <div class="goal-info"><div class="goal-title">🎯 今日目标：新词 <span id="goalNew">30</span> 个 | 复习 <span id="goalReview">0</span> 个</div><div class="goal-detail" id="goalProgressText">已完成 0%</div><div class="goal-progress"><div class="goal-progress-fill" id="goalProgressFill" style="width:0%"></div></div></div>
    </div>
    <div class="stats-strip">
        <div class="stat-chip"><div class="stat-value" id="statTotal">0</div><div class="stat-label">词库</div></div>
        <div class="stat-chip"><div class="stat-value" id="statLearned">0</div><div class="stat-label">已学</div></div>
        <div class="stat-chip"><div class="stat-value" id="statMastered">0</div><div class="stat-label">掌握</div></div>
        <div class="stat-chip"><div class="stat-value" id="statToday">0</div><div class="stat-label">今日</div></div>
    </div>
    <div class="tab-nav">
        <button class="tab-btn active" data-tab="learn">📘 新词学习</button>
        <button class="tab-btn" data-tab="review">🔄 智能复习</button>
        <button class="tab-btn" data-tab="wordbank">📚 词库</button>
    </div>

    <div class="panel active" id="panel-learn">
        <div style="text-align:center;font-size:0.8rem;color:var(--text-secondary);">今日还需 <span id="learnRemain">0</span> 个新词</div>
        <div class="card-container" id="learnCardContainer">
            <div class="card-inner" id="learnCardInner">
                <div class="card-face card-front">
                    <div class="card-word" id="learnWord">loading</div>
                    <div class="card-phonetic" id="learnPhonetic"></div>
                    <div class="card-pos-tag" id="learnPos"></div>
                    <button class="card-pronounce-btn" id="learnPronounceBtn">🔊</button>
                    <div class="card-tap-hint">👆 点击翻转看释义及关联</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-meaning" id="learnMeaning"></div>
                    <div class="card-relations" id="learnRelations"></div>
                    <div class="card-tap-hint">👆 点击翻转回单词</div>
                </div>
            </div>
        </div>
        <div class="self-rate-group" id="learnRateGroup" style="display:none;">
            <button class="self-rate-btn known" data-rate="known">✅ 我认识</button>
            <button class="self-rate-btn unknown" data-rate="unknown">❌ 不认识</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-outline btn-sm" id="learnSkipBtn">⏭ 跳过</button>
            <span style="font-weight:600;" id="learnProgressText">0/0</span>
        </div>
    </div>

    <div class="panel" id="panel-review">
        <div style="text-align:center;font-size:0.8rem;color:var(--text-secondary);" id="reviewDirectionHint">复习中 · 请回忆对应含义</div>
        <div class="card-container" id="reviewCardContainer">
            <div class="card-inner" id="reviewCardInner">
                <div class="card-face card-front" id="reviewCardFace">
                    <div class="card-word" id="reviewPrompt">—</div>
                    <div class="card-pos-tag" id="reviewPosTag" style="display:none;"></div>
                    <div id="reviewLetterHint" style="font-size:0.85rem;color:var(--text-light);margin-top:8px;display:none;"></div>
                    <button class="card-pronounce-btn" id="reviewPronounceBtn" style="display:none;">🔊</button>
                </div>
            </div>
        </div>
        <button class="btn btn-accent" id="revealAnswerBtn" style="width:100%;">💡 显示答案</button>
        <div class="self-rate-group" id="reviewRateGroup" style="display:none;">
            <button class="self-rate-btn known" data-rate="known">✅ 认识</button>
            <button class="self-rate-btn" style="border-color:#f6ad55;color:#b76e00;" data-rate="fuzzy">🤔 模糊</button>
            <button class="self-rate-btn unknown" data-rate="unknown">❌ 不认识</button>
        </div>
        <div id="reviewRelations" style="font-size:0.85rem;color:var(--text-secondary);text-align:center;margin-top:6px;"></div>
        <div class="btn-row">
            <button class="btn btn-outline btn-sm" id="reviewSkipBtn">⏭ 跳过</button>
            <button class="btn btn-outline btn-sm" id="reviewRestartBtn">🔄 重新开始</button>
        </div>
    </div>

    <div class="panel" id="panel-wordbank">
        <div class="upload-zone" id="uploadZone"><div class="upload-icon">📂</div>点击上传JSON词库<input type="file" id="fileInput" accept=".json" style="display:none;"></div>
        <div>⚙️ 每日新词 <input type="number" id="dailyNewInput" min="5" max="100" value="30" style="width:70px;padding:6px;border-radius:8px;border:1px solid #ccc;"> <button class="btn btn-sm btn-primary" id="saveDailyNewBtn">保存</button></div>
        <button class="btn btn-outline btn-sm" id="presetFullBtn">🎯 加载中考1600词（极强关联）</button>
        <div class="btn-row"><button class="btn btn-outline btn-sm" id="exportBtn">📥 导出</button><button class="btn btn-outline btn-sm" id="resetProgressBtn" style="color:#c00030;">🗑 重置</button></div>
        <div class="word-table-wrap" style="max-height:300px;overflow:auto;"><table style="width:100%;font-size:0.8rem;border-collapse:collapse;"><thead><tr><th>单词</th><th>音标</th><th>词性</th><th>释义</th></tr></thead><tbody id="wordTableBody"></tbody></table></div>
    </div>
</div>
<div class="toast" id="toast"></div>

            "top": {syn:["peak","summit"],ant:["bottom","base"],fam:[]},
            "town": {syn:["city","village"],ant:[],fam:[]},
            "travel": {syn:["journey","tour"],ant:[],fam:[]},
            "tree": {syn:["plant","wood"],ant:[],fam:[]},
            "true": {syn:["real","factual"],ant:["false","fake"],fam:[{w:"truth",p:"n.",m:"真相"}]},
            "try": {syn:["attempt","endeavor"],ant:[],fam:[]},
            "turn": {syn:["rotate","spin"],ant:[],fam:[]},
            "under": {syn:["below","beneath"],ant:["over","above"],fam:[]},
            "understand": {syn:["comprehend","grasp"],ant:["misunderstand","confuse"],fam:[{w:"understanding",p:"n.",m:"理解"}]},
            "up": {syn:["above","high"],ant:["down","low"],fam:[]},
            "use": {syn:["utilize","employ"],ant:[],fam:[{w:"useful",p:"adj.",m:"有用的"},{w:"useless",p:"adj.",m:"无用的"}]},
            "very": {syn:["extremely","really"],ant:[],fam:[]},
            "visit": {syn:["call upon","tour"],ant:[],fam:[]},
            "wait": {syn:["await","stay"],ant:[],fam:[]},
            "walk": {syn:["stroll","step"],ant:["run"],fam:[]},
            "want": {syn:["desire","wish"],ant:["dislike","hate"],fam:[]},
            "warm": {syn:["mild","hot"],ant:["cold","cool"],fam:[{w:"warmth",p:"n.",m:"温暖"}]},
            "wash": {syn:["clean","rinse"],ant:["dirty","soil"],fam:[]},
            "watch": {syn:["observe","view"],ant:[],fam:[]},
            "water": {syn:["liquid","fluid"],ant:[],fam:[]},
            "way": {syn:["method","manner"],ant:[],fam:[]},
            "weak": {syn:["feeble","frail"],ant:["strong","powerful"],fam:[{w:"weakness",p:"n.",m:"弱点"}]},
            "week": {syn:["seven days"],ant:[],fam:[{w:"weekend",p:"n.",m:"周末"}]},
            "well": {syn:["fine","good"],ant:["badly","poorly"],fam:[]},
            "west": {syn:["occidental"],ant:["east"],fam:[]},
            "white": {syn:["pale","snowy"],ant:["black","dark"],fam:[]},
            "whole": {syn:["entire","complete"],ant:["part","partial"],fam:[]},
            "wide": {syn:["broad","spacious"],ant:["narrow","tight"],fam:[]},
            "will": {syn:["shall","intend"],ant:[],fam:[]},
            "win": {syn:["triumph","conquer"],ant:["lose","fail"],fam:[{w:"winner",p:"n.",m:"赢家"}]},
            "wind": {syn:["breeze","gust"],ant:[],fam:[{w:"windy",p:"adj.",m:"有风的"}]},
            "winter": {syn:["cold season"],ant:["summer"],fam:[]},
            "wish": {syn:["desire","hope"],ant:[],fam:[]},
            "with": {syn:["alongside","including"],ant:["without"],fam:[]},
            "without": {syn:["lacking","missing"],ant:["with"],fam:[]},
            "woman": {syn:["lady","female"],ant:["man","male"],fam:[]},
            "wonder": {syn:["marvel","miracle"],ant:[],fam:[{w:"wonderful",p:"adj.",m:"精彩的"}]},
            "word": {syn:["term","expression"],ant:[],fam:[]},
            "work": {syn:["job","labor"],ant:["rest","play"],fam:[{w:"worker",p:"n.",m:"工人"}]},
            "world": {syn:["earth","globe"],ant:[],fam:[]},
            "worry": {syn:["fret","stress"],ant:["calm","relax"],fam:[{w:"worried",p:"adj.",m:"担心的"}]},
            "write": {syn:["compose","jot"],ant:[],fam:[{w:"writer",p:"n.",m:"作家"}]},
            "wrong": {syn:["incorrect","false"],ant:["right","correct"],fam:[]},
            "young": {syn:["youthful","juvenile"],ant:["old","elderly"],fam:[{w:"youth",p:"n.",m:"青春"}]},
            "zero": {syn:["nothing","nil"],ant:[],fam:[]}
        };
        words.forEach(w => {
            if (enrich[w.word]) {
                w.synonyms = enrich[w.word].syn || [];
                w.antonyms = enrich[w.word].ant || [];
                w.wordFamily = enrich[w.word].fam || [];
            }
        });
        return words;
    }

    const STORAGE_W = 'wm_w3', STORAGE_P = 'wm_p3', STORAGE_T = 'wm_t3', STORAGE_S = 'wm_s3', STORAGE_SET = 'wm_set3';
    function loadW() { let d=localStorage.getItem(STORAGE_W); return d ? JSON.parse(d) : (d=getFullWordbank(), saveW(d), d); }
    function saveW(b) { localStorage.setItem(STORAGE_W, JSON.stringify(b)); }
    function loadP() { let d=localStorage.getItem(STORAGE_P); return d ? JSON.parse(d) : {}; }
    function saveP(p) { localStorage.setItem(STORAGE_P, JSON.stringify(p)); }
    function loadT() { let d=localStorage.getItem(STORAGE_T); if(d){let o=JSON.parse(d); if(o.date===new Date().toDateString()) return o;} return {date:new Date().toDateString(),newL:0,rev:0}; }
    function saveT(t){ localStorage.setItem(STORAGE_T, JSON.stringify(t)); }
    function loadS(){ let d=localStorage.getItem(STORAGE_S); return d ? JSON.parse(d) : {last:null,str:0}; }
    function saveS(s){ localStorage.setItem(STORAGE_S, JSON.stringify(s)); }
    function loadSet(){ let d=localStorage.getItem(STORAGE_SET); return d ? JSON.parse(d) : {daily:30}; }
    function saveSet(s){ localStorage.setItem(STORAGE_SET, JSON.stringify(s)); }

    let wordbank = loadW(), progress = loadP(), today = loadT(), streak = loadS(), settings = loadSet();
    let todayNewL = today.newL, todayRev = today.rev;

    function updStreak(){
        const ts = new Date().toDateString();
        if(streak.last===ts) return;
        const yest = new Date(Date.now()-864e5).toDateString();
        streak.str = (streak.last===yest) ? streak.str+1 : 1;
        streak.last = ts; saveS(streak);
    }
    function pronounce(w){
        if(!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(w); u.lang='en-US'; u.rate=0.8;
        speechSynthesis.speak(u);
    }
    function getProg(w){ let k=w.toLowerCase(); return progress[k] || {fam:0,cnt:0}; }
    function updProg(w,d){
        let k=w.toLowerCase();
        if(!progress[k]) progress[k]={fam:0,cnt:0,next:0};
        progress[k].cnt++; progress[k].fam = Math.min(10,Math.max(0,(progress[k].fam||0)+d));
        let h=4; if(progress[k].fam<=2)h=2; else if(progress[k].fam<=4)h=8; else if(progress[k].fam<=6)h=24; else if(progress[k].fam<=8)h=72; else h=168;
        progress[k].next = Date.now()+h*3600000;
        saveP(progress);
    }
    function lrnCnt(){ return Object.keys(progress).filter(k=>progress[k].cnt>0).length; }
    function mstCnt(){ return Object.keys(progress).filter(k=>progress[k].fam>=8).length; }
    function dueCnt(){ let n=0,c=Date.now(); for(let k in progress) if(progress[k].next && progress[k].next<=c) n++; return n; }

    function updateStats(){
        document.getElementById('statTotal').textContent=wordbank.length;
        document.getElementById('statLearned').textContent=lrnCnt();
        document.getElementById('statMastered').textContent=mstCnt();
        document.getElementById('statToday').textContent=todayRev;
        document.getElementById('streakDays').textContent=streak.str;
        document.getElementById('goalNew').textContent=settings.daily;
        let due = dueCnt();
        document.getElementById('goalReview').textContent=due;
        let doneN=Math.min(todayNewL,settings.daily), total=settings.daily+due, done=doneN+todayRev;
        document.getElementById('goalProgressText').textContent=`新词 ${doneN}/${settings.daily} · 复习 ${todayRev}`;
        document.getElementById('goalProgressFill').style.width= total>0?Math.min(100,Math.round(done/total*100))+'%':'0%';
    }

    function renderRelations(entry){
        let h='';
        if(entry.synonyms && entry.synonyms.length){
            h+='<div class="rel-section"><div class="rel-title">🔗 同义词</div>';
            entry.synonyms.forEach(s=> h+=`<span class="rel-item syn">${s}</span>`);
            h+='</div>';
        }
        if(entry.antonyms && entry.antonyms.length){
            h+='<div class="rel-section"><div class="rel-title">🚫 反义词</div>';
            entry.antonyms.forEach(s=> h+=`<span class="rel-item ant">${s}</span>`);
            h+='</div>';
        }
        if(entry.wordFamily && entry.wordFamily.length){
            h+='<div class="rel-section"><div class="rel-title">🌱 词根演变</div>';
            entry.wordFamily.forEach(f=> h+=`<span class="rel-item fam">${f.w} (${f.p}) ${f.m}</span>`);
            h+='</div>';
        }
        return h;
    }

    let learnQ=[], learnI=0, learnFlip=false;
    function buildLearnQ(){
        let learned = new Set(Object.keys(progress).filter(k=>progress[k].cnt>0));
        let cand=[]; wordbank.forEach((e,i)=>{ if(!learned.has(e.word.toLowerCase())) cand.push(i); });
        learnQ = cand.sort(()=>Math.random()-0.5);
        let max = settings.daily - todayNewL;
        if(learnQ.length>max) learnQ=learnQ.slice(0,max);
        learnI=0; learnFlip=false;
    }
    function showLearnCard(){
        let el=id=>document.getElementById(id);
        if(!learnQ.length){
            el('learnWord').textContent='🎉 新词已学完！'; el('learnRemain').textContent='0'; el('learnRateGroup').style.display='none'; el('learnRelations').innerHTML=''; return;
        }
        let entry = wordbank[learnQ[learnI]];
        el('learnWord').textContent=entry.word; el('learnPhonetic').textContent=entry.phonetic||'';
        el('learnPos').textContent=entry.pos||''; el('learnMeaning').textContent=entry.meaning||'';
        el('learnRelations').innerHTML = renderRelations(entry);
        el('learnRemain').textContent = learnQ.length - learnI;
        el('learnProgressText').textContent = `${learnI+1}/${learnQ.length}`;
        el('learnRateGroup').style.display='flex';
        learnFlip=false; el('learnCardInner').classList.remove('flipped');
    }
    function flipLearn(){ learnFlip=!learnFlip; document.getElementById('learnCardInner').classList.toggle('flipped',learnFlip); }
    function rateLearn(rate){
        if(!learnQ.length) return;
        let entry=wordbank[learnQ[learnI]];
        updProg(entry.word, rate==='known'?3:0);
        todayNewL++; today.newL=todayNewL; saveT(today); updStreak();
        learnI++; if(learnI>=learnQ.length){ learnQ=[]; showLearnCard(); } else showLearnCard();
        updateStats();
    }

    let reviewQ=[], reviewI=0, reviewSE=true, reviewAns=false;
    function buildReviewQ(){
        let now=Date.now(), due=[];
        wordbank.forEach((e,i)=>{
            let p=getProg(e.word);
            if(p.cnt>0 && p.next && p.next<=now) due.push({idx:i,ent:e,se:Math.random()<0.5});
        });
        if(!due.length){
            wordbank.forEach((e,i)=>{ let p=getProg(e.word); if(p.cnt>0 && p.fam<=4) due.push({idx:i,ent:e,se:Math.random()<0.5}); });
            if(!due.length) wordbank.slice(0,10).forEach((e,i)=> due.push({idx:i,ent:e,se:Math.random()<0.5}));
        }
        reviewQ = due.sort(()=>Math.random()-0.5); reviewI=0; reviewAns=false;
    }
    function showReviewCard(){
        let el=id=>document.getElementById(id);
        reviewAns=false; el('reviewRateGroup').style.display='none'; el('revealAnswerBtn').style.display='block'; el('reviewRelations').innerHTML='';
        if(!reviewQ.length){ el('reviewPrompt').textContent='✨ 暂无待复习'; return; }
        let item=reviewQ[reviewI]; reviewSE=item.se;
        if(reviewSE){
            el('reviewPrompt').textContent=item.ent.word;
            el('reviewPosTag').style.display='inline-block'; el('reviewPosTag').textContent=item.ent.pos||'';
            el('reviewLetterHint').style.display='none'; el('reviewPronounceBtn').style.display='inline-block';
            el('reviewDirectionHint').textContent='👀 英文 → 回忆中文';
        }else{
            el('reviewPrompt').textContent=item.ent.meaning||'';
            el('reviewPosTag').style.display='none'; el('reviewLetterHint').style.display='block';
            el('reviewLetterHint').textContent=`首字母 "${item.ent.word[0].toUpperCase()}" · ${item.ent.word.length}个字母`;
            el('reviewPronounceBtn').style.display='none'; el('reviewDirectionHint').textContent='🧠 中文 → 回忆英文';
        }
    }
    function revealReview(){
        if(!reviewQ.length||reviewAns) return;
        reviewAns=true; document.getElementById('revealAnswerBtn').style.display='none';
        document.getElementById('reviewRateGroup').style.display='flex';
        let ent=reviewQ[reviewI].ent, face=document.getElementById('reviewCardFace');
        face.querySelector('.review-answ')?.remove();
        let ans=document.createElement('div'); ans.className='review-answ';
        if(reviewSE){
            ans.textContent=ent.meaning; ans.style.cssText='font-size:1.6rem;color:#9b2c5c;margin-top:8px;';
            document.getElementById('reviewRelations').innerHTML = renderRelations(ent);
        }else{
            ans.textContent=ent.word; ans.style.cssText='font-size:2rem;color:#1e293b;margin-top:8px;';
            pronounce(ent.word);
            document.getElementById('reviewRelations').innerHTML = renderRelations(ent);
        }
        face.appendChild(ans);
    }
    function rateReview(rate){
        if(!reviewAns) return;
        let ent=reviewQ[reviewI].ent, delta = rate==='known'?2: (rate==='fuzzy'?0:-2);
        updProg(ent.word, delta);
        todayRev++; today.rev=todayRev; saveT(today); updStreak();
        document.getElementById('reviewCardFace').querySelector('.review-answ')?.remove();
        document.getElementById('reviewRelations').innerHTML='';
        reviewI++; if(reviewI>=reviewQ.length){ reviewQ=[]; showReviewCard(); } else showReviewCard();
        updateStats();
    }
    function toast(m){ let t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000); }
    function esc(s){ let d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function renderTable(){
        let p=wordbank.slice(0,40), html=p.map(w=>`<tr><td>${esc(w.word)}</td><td>${esc(w.phonetic||'')}</td><td>${esc(w.pos||'')}</td><td>${esc(w.meaning||'')}</td></tr>`).join('');
        document.getElementById('wordTableBody').innerHTML=html||'<tr><td colspan="4">无</td></tr>';
    }

    document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{
        let tab=b.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        document.getElementById('panel-'+tab).classList.add('active');
        if(tab==='learn'){ buildLearnQ(); showLearnCard(); }
        if(tab==='review'){ buildReviewQ(); showReviewCard(); }
        if(tab==='wordbank') renderTable();
    }));
    document.getElementById('learnCardContainer').addEventListener('click',flipLearn);
    document.getElementById('learnPronounceBtn').addEventListener('click',e=>{e.stopPropagation(); if(learnQ.length) pronounce(wordbank[learnQ[learnI]].word);});
    document.getElementById('learnSkipBtn').addEventListener('click',()=>{if(learnQ.length){learnI++; if(learnI>=learnQ.length){learnQ=[];showLearnCard();}else showLearnCard();}});
    document.getElementById('learnRateGroup').addEventListener('click',e=>{if(e.target.classList.contains('self-rate-btn')) rateLearn(e.target.dataset.rate);});
    document.addEventListener('keydown',e=>{
        if(!document.getElementById('panel-learn').classList.contains('active')) return;
        if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ if(learnQ.length){ learnI=(learnI+(e.key==='ArrowLeft'?-1:1)+learnQ.length)%learnQ.length; showLearnCard(); } }
        if(e.key===' '){ e.preventDefault(); flipLearn(); }
    });
    document.getElementById('revealAnswerBtn').addEventListener('click',revealReview);
    document.getElementById('reviewPronounceBtn').addEventListener('click',e=>{e.stopPropagation(); if(reviewQ.length&&reviewSE) pronounce(reviewQ[reviewI].ent.word);});
    document.getElementById('reviewSkipBtn').addEventListener('click',()=>{if(reviewQ.length){reviewI++; if(reviewI>=reviewQ.length){reviewQ=[];showReviewCard();}else showReviewCard();}});
    document.getElementById('reviewRestartBtn').addEventListener('click',()=>{buildReviewQ();showReviewCard();});
    document.getElementById('reviewRateGroup').addEventListener('click',e=>{if(e.target.classList.contains('self-rate-btn')) rateReview(e.target.dataset.rate);});
    document.getElementById('uploadZone').addEventListener('click',()=>document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change',()=>{ let f=document.getElementById('fileInput').files[0]; if(f) handleFile(f); });
    function handleFile(f){
        let r=new FileReader(); r.onload=function(e){
            try{
                let d=JSON.parse(e.target.result); if(!Array.isArray(d)) throw new Error();
                wordbank=d.filter(w=>w.word&&w.meaning); saveW(wordbank); renderTable(); buildLearnQ();showLearnCard();buildReviewQ();updateStats();
                toast('词库已加载');
            }catch{toast('文件格式错误');}
        }; r.readAsText(f);
    }
    document.getElementById('exportBtn').addEventListener('click',()=>{ let b=new Blob([JSON.stringify(wordbank)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='wordbank.json'; a.click(); });
    document.getElementById('resetProgressBtn').addEventListener('click',()=>{if(confirm('重置所有进度？')){progress={}; saveP(progress); today={date:new Date().toDateString(),newL:0,rev:0}; saveT(today); todayNewL=0;todayRev=0; streak={last:null,str:0}; saveS(streak); updateStats(); buildLearnQ();showLearnCard();buildReviewQ();showReviewCard();}});
    document.getElementById('saveDailyNewBtn').addEventListener('click',()=>{ let v=parseInt(document.getElementById('dailyNewInput').value); if(v>=5&&v<=100){ settings.daily=v; saveSet(settings); updateStats(); buildLearnQ();showLearnCard(); } });
    document.getElementById('presetFullBtn').addEventListener('click',()=>{ wordbank=getFullWordbank(); saveW(wordbank); renderTable(); buildLearnQ();showLearnCard();buildReviewQ();updateStats(); toast('已加载1600词重关联版'); });

    function init(){
        document.getElementById('dailyNewInput').value=settings.daily;
        updStreak(); updateStats(); renderTable();
        buildLearnQ(); showLearnCard(); buildReviewQ(); showReviewCard();
    }
    init();
})();
</script>
</body>
</html>
